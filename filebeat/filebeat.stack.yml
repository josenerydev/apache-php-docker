services:
  filebeat:
    image: elastic/filebeat:8.15.3
    volumes:
      - ./filebeat.yml:/usr/share/filebeat/filebeat.yml
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - elastic_network
    deploy:
      restart_policy:
        condition: on-failure
networks:
  elastic_network:
    external: true
