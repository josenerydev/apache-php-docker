version: '3.8'

services:
  nginx:
    image: nginx:latest
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - webnet
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  web:
    image: app:1.0.2
    volumes:
      - ./html:/var/www/html
    networks:
      - webnet
    deploy:
      replicas: 3
      restart_policy:
        condition: on-failure

networks:
  webnet:
    external: true
