<source>
  @type forward
  port 24224
  bind 0.0.0.0
</source>

<filter nginx.container>
  @type parser
  key_name log
  reserve_data true
  <parse>
    @type json
    time_key time
    time_format %Y-%m-%dT%H:%M:%S%z
  </parse>
</filter>

<match nginx.container>
  @type copy

  <store>
    @type elasticsearch
    scheme http
    host elasticsearch
    port 9200
    user elastic
    password TdptwLko5fGX6THYSnMtHFUSh0SYltT/pncvdxjyj60g=
    logstash_format true
    logstash_prefix nginx-logs
    logstash_dateformat %Y%m%d
    include_tag_key true
    tag_key @log_name
    time_key time
    time_format %Y-%m-%dT%H:%M:%S%z
    flush_interval 1s

    <buffer>
      flush_mode immediate
      flush_thread_count 2
      retry_max_interval 30s
    </buffer>
  </store>

  <store>
    @type stdout
  </store>
</match>

